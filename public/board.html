<script>
(() => {
  'use strict';
  const pages=JSON.parse(document.getElementById('capture-plan').textContent);
  const groups=['首页','会话','任务','记忆','我的'];
  const board=document.getElementById('board'),nav=document.getElementById('groups');
  const nodes=new Map(),sections=new Map();
  let selected='全部',query='',onlyMissing=false,zoom=100;
  const baseline=window.matchMedia('(max-width:480px)').matches?155:236;
  const hrefFor=route=>'/#'+[route.view,route.id||'',route.mode||''].map(encodeURIComponent).join('/').replace(/\/+$/,'');
  function tab(label,count){const button=document.createElement('button');button.type='button';button.className='tab';button.dataset.group=label;button.setAttribute('aria-pressed',String(label==='全部'));button.append(document.createTextNode(label));const number=document.createElement('span');number.textContent=count;button.append(number);button.addEventListener('click',()=>{selected=label;applyFilter();});nav.append(button);}
  tab('全部',pages.length);groups.forEach(group=>tab(group,pages.filter(p=>p.group===group).length));
  groups.forEach(group=>{const section=document.createElement('section');section.className='group';section.setAttribute('aria-label',group+'页面');const heading=document.createElement('div');heading.className='group-heading';const title=document.createElement('h2');title.textContent=group;const number=document.createElement('span');number.textContent=pages.filter(p=>p.group===group).length;heading.append(title,number);const grid=document.createElement('div');grid.className='page-grid';section.append(heading,grid);sections.set(group,{section,number,grid});board.append(section);});
  function countCaptures(){const captured=[...nodes.values()].filter(n=>n.link.dataset.captured==='true').length;const pending=[...nodes.values()].filter(n=>n.link.dataset.captured==='pending').length;const output=document.getElementById('capture-count');output.replaceChildren();const strong=document.createElement('strong');strong.textContent=captured;output.append(document.createTextNode('已捕获 '),strong,document.createTextNode(' / '+pages.length+(pending?' · 读取中':'')));}
  pages.forEach(page=>{
    const link=document.createElement('a');link.className='page-card';link.href=hrefFor(page.route);link.target='_blank';link.rel='noopener';link.dataset.captured='pending';link.setAttribute('aria-label','打开 '+page.title);link.dataset.key=page.key;
    const thumb=document.createElement('div');thumb.className='thumbnail';thumb.dataset.status='loading';
    const img=document.createElement('img');img.alt=page.title+' · App实际截图';img.draggable=false;img.decoding='async';
    const missing=document.createElement('div');missing.className='missing';const missTitle=document.createElement('strong');missTitle.textContent='未捕获真实状态';const missText=document.createElement('span');missText.textContent='点击进入 App';missing.append(missTitle,missText);thumb.append(img,missing);
    const caption=document.createElement('div');caption.className='caption';const dot=document.createElement('span');dot.className='dot';const title=document.createElement('h3');title.textContent=page.title;const arrow=document.createElement('img');arrow.src='/icons/arrow-up-right.svg';arrow.alt='';caption.append(dot,title,arrow);link.append(thumb,caption);
    sections.get(page.group).grid.append(link);nodes.set(page.key,{link,thumb,page});
    img.addEventListener('load',()=>{thumb.dataset.status='captured';link.dataset.captured='true';countCaptures();if(onlyMissing)applyFilter();});
    img.addEventListener('error',()=>{thumb.dataset.status='missing';link.dataset.captured='false';img.removeAttribute('src');countCaptures();if(onlyMissing)applyFilter();},{once:true});
    img.src='/board-shots/'+encodeURIComponent(page.key)+'.jpg';
  });
  function applyFilter(){let total=0;nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.group===selected)));groups.forEach(group=>{let count=0;pages.filter(p=>p.group===group).forEach(page=>{const node=nodes.get(page.key);const searchable=(page.title+' '+page.group+' '+page.route.view).toLowerCase();const show=(selected==='全部'||selected===group)&&searchable.includes(query)&&(!onlyMissing||node.link.dataset.captured==='false');node.link.hidden=!show;if(show)count++;});const {section,number}=sections.get(group);section.hidden=count===0;number.textContent=count;total+=count;});document.getElementById('empty').style.display=total?'none':'block';}
  document.getElementById('search').addEventListener('input',event=>{query=event.target.value.trim().toLowerCase();applyFilter();});
  document.getElementById('missing-filter').addEventListener('click',event=>{onlyMissing=!onlyMissing;event.currentTarget.setAttribute('aria-pressed',String(onlyMissing));applyFilter();});
  function setZoom(value){zoom=Math.max(65,Math.min(170,Math.round(value/5)*5));document.documentElement.style.setProperty('--card-width',Math.round(baseline*zoom/100)+'px');document.getElementById('zoom').value=zoom;document.getElementById('zoom-output').textContent=zoom+'%';document.getElementById('zoom-out').disabled=zoom===65;document.getElementById('zoom-in').disabled=zoom===170;}
  document.getElementById('zoom').addEventListener('input',event=>setZoom(Number(event.target.value)));document.getElementById('zoom-in').addEventListener('click',()=>setZoom(zoom+10));document.getElementById('zoom-out').addEventListener('click',()=>setZoom(zoom-10));
  window.addEventListener('wheel',event=>{if(event.ctrlKey||event.metaKey){event.preventDefault();setZoom(zoom+(event.deltaY<0?5:-5));}},{passive:false});
  setZoom(100);countCaptures();applyFilter();
})();
</script>
