<div id="gate" class="gate" hidden><div class="brand">Oops</div><h1>打开团队核对链接</h1><p>请使用原来的完整链接进入。核对内容和声音身份会分别保存。</p></div>

<div id="app" hidden>
<header class="topbar"><div class="top-inner"><div class="brand">Oops<span>会议核对</span></div><div class="top-right"><span id="state" class="save-state" role="status" aria-live="polite">读取中</span><button id="switch" class="quiet"></button><button id="help-open" class="quiet">帮助</button></div></div></header>
<main class="shell">
<div class="page-head"><div><p class="eyebrow">当前会议</p><select id="meeting" class="meeting-picker" aria-label="选择会议"></select><div class="progress-line" aria-hidden="true"><span id="progress-fill"></span></div><div id="progress-copy" class="progress-copy"></div></div><nav class="tabs" aria-label="核对工作区"><button class="tab" id="tab-content" aria-pressed="true">标内容<span id="content-count" class="count"></span></button><button class="tab" id="tab-voice" aria-pressed="false">认声音<span id="voice-count" class="count"></span></button></nav></div>
<div id="notice" class="notice" hidden><span id="notice-text"></span><button id="retry" class="button" hidden>重试保存</button><button id="reload" class="button">重新读取</button></div>
<div class="workspace"><details class="queue" id="queue"><summary><span id="queue-summary">查看记录列表</span><span>展开列表</span></summary><div class="queue-inner"><p id="queue-title" class="queue-title">本场记录</p><div id="queue-tools" class="queue-tools"><button class="filter" data-filter="todo" aria-pressed="true">待核对</button><button class="filter" data-filter="all" aria-pressed="false">全部</button><button class="filter" data-filter="marked" aria-pressed="false">任务 / 决定</button></div><input id="search" class="search" type="search" placeholder="搜索原话" aria-label="搜索原话"><div id="queue-list" class="queue-list"></div></div></details><section class="focus" id="focus" aria-label="当前核对内容"></section></div>

</main>
</div>
<dialog id="help"><h2>怎么核对</h2><p><strong>标内容：</strong>先听一段原话，再选有用内容、任务、决定或无关内容。任务另选负责人；不同内容可逐句修改，整段操作会保留单句修正。</p><p><strong>认声音：</strong>听代表录音、查看关联范围，再确认整组是谁。身份关联不改变内容类别。混入的句子可以单独移出或改名。</p><p>短上下文可以跳过。保存失败可重试；本场标注与音色组各有撤销记录。键盘 ↑↓ 换段，空格播放，I/T/D/N 标内容。</p><button id="help-close" class="button primary">知道了</button></dialog>
<script>

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clock=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}},remove(k){try{localStorage.removeItem(k)}catch{}}};
let KEY='',WHO=store.get('oops-label-who')||'',ME=null,M=null,U=[],ROW={},L={},E=[],DOC=null,IDENTITY=null,cur=0,voiceCur=0,mode='content',filter='todo',query='',queueLimit=100,memberLimit=30,memberQuery='',editRow=null,correctionsOpen=false,extrasOpen=false,membersOpen=false,busy=false,pending=null,needsReload=false,cont=false;

if(hash.get('k')){KEY=hash.get('k');store.set('oops-label-key',KEY);history.replaceState(null,'',location.pathname+location.search)}else KEY=store.get('oops-label-key')||'';
const api=async(p,o={})=>{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{return await fetch(p.replace(/^\//,''),{...o,signal:controller.signal,headers:{...(o.headers||{}),Authorization:'Bearer '+KEY,...(WHO?{'X-Labeler':encodeURIComponent(WHO)}:{})}})}finally{clearTimeout(timer)}};
const pendingKey=()=>`oops-label-pending:${ME.name}`;

async function get(path){const r=await api(path);if(!r.ok)throw new Error(r.status);return r.json()}
function lock(){document.querySelectorAll('#app button,#app select,#app input').forEach(b=>b.disabled=busy||!!pending||needsReload);$('#retry').disabled=busy;$('#reload').disabled=busy||!!pending;$('#help-open').disabled=false;const undo=$('#undo');if(undo)undo.disabled=busy||!!pending||needsReload||!(mode==='content'?DOC?.can_undo:IDENTITY?.can_undo);const ids=mode==='content'?navigable():(IDENTITY?.groups||[]).map((_,i)=>i),position=ids.indexOf(mode==='content'?cur:voiceCur);if($('#previous'))$('#previous').disabled=busy||!!pending||needsReload||position<=0;if($('#next'))$('#next').disabled=busy||!!pending||needsReload||position<0||position>=ids.length-1}

function navigable(){const ids=matching();if(cur>=0&&!ids.includes(cur)&&E[cur]&&(!query||E[cur].text.toLowerCase().includes(query.toLowerCase())))ids.push(cur);return ids.sort((a,b)=>a-b)}

(async()=>{if(!KEY){$('#gate').hidden=false;return}try{ME=await get('/api/me');if(!ME.name){if(WHO){WHO='';store.remove('oops-label-who')}$('#pick').hidden=false;$('#pickers').innerHTML=ME.people.map(p=>`<button data-person="${esc(p)}">${esc(p)}</button>`).join('');$('#pickers').onclick=e=>{const b=e.target.closest('button');if(b){store.set('oops-label-who',b.dataset.person);location.reload()}};return}
 $('#app').hidden=false;$('#switch').textContent=(NAMES[ME.name]||ME.name)+(WHO?' · 切换':'');$('#switch').hidden=!WHO;$('#meeting').innerHTML=ME.meetings.map(m=>`<option value="${esc(m.id)}">${esc(m.title)}</option>`).join('');autoNext=store.get(`oops-label-auto-next:${ME.name}`)==='true';mode=store.get(`oops-label-mode:${ME.name}`)==='voice'?'voice':'content';IDENTITY=await get('/api/identity');const last=store.get('oops-label-meeting'),mid=ME.meetings.some(m=>m.id===last)?last:ME.meetings[0]?.id;if(mid){$('#meeting').value=mid;await openMeeting(mid)}else status('暂无会议',true);const saved=store.get(pendingKey());if(saved){pending=JSON.parse(saved);status('有一次保存尚未确认，请重试。',true);lock()}
 }catch{$('#gate').hidden=false;$('#gate p').textContent='读取失败或链接失效，请重新打开原来的完整链接。'}})();
