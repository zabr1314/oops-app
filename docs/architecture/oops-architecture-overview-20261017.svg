<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1760" viewBox="0 0 1840 1760" role="img" aria-labelledby="title description">
<title id="title">Oops 技术架构总览 · 2026-10-17</title>
<desc id="description">分区架构总览：录音设备与手机端采集现场声音，手机直连流式语音识别；原话经加密连接进入Python后端。早期由Jev进行实时分类与判断，当前由Sol统一理解与整理。后端保存会议文件和独立协作任务，网页承接回看、增量草稿和人工核对；主后端的Raft API将协作任务、发送队列和回复保存到三个独立SQLite库；可信电脑上的派工程序通过认证接口主动轮询领单、核对发送许可，再经Raft SDK以Oops服务账号发到协作群，由用户电脑上的AI助手执行并在原线程回复；派工程序读取确切线程并写回后端，手机通过原接口读取对应任务结果。</desc>
