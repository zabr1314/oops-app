<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Oops 技术架构 · 路演版</title>
<desc id="desc">六步流程搭配关键技术：蓝牙与Opus采集；手机直连流式ASR；原话经HTTPS进入Python后端，Sol增量理解；校验本人身份与来源后确认派工；后端队列由Mac桥接程序经Raft交给执行电脑；原线程回复返回原任务。会议与原音使用私有文件，协作任务、派工与回复使用独立SQLite。</desc>
