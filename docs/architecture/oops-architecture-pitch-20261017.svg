<text x="88" y="823" class="chain"><tspan font-weight="600" fill="#765f98">理解链路</tspan><tspan dx="24">手机直连流式识别 → 原话经 HTTPS 进入 Python 后端 → Sol 增量整理</tspan></text>
<text x="88" y="874" class="chain"><tspan font-weight="600" fill="#765f98">执行链路</tspan><tspan dx="24">后端任务队列 → Mac 派工程序（Raft）→ 执行电脑 → 原任务回流</tspan></text>
<text x="88" y="923" class="note">数据保存：会议与原音使用私有文件；协作任务、派工与回复使用独立 SQLite。</text>
