<title id="title">Oops 技术架构 · 2026-10-17</title>
<desc id="description">Android 主版通过手机直连火山实时 ASR，原话经可信 Python 后端交由 Sol 理解；私有文件与 SQLite 保存会议、草稿和协作。独立 History 只读展示，可信 Mac worker 将明确交办的任务发送至 Raft 并回收 a1234 原线程回复。辅助 Apple 接入和 React 原型单独标注。</desc>
