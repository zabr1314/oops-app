# Include inside the Hong Kong :8444 server next to /oops-meeting/; the Japan entry already forwards /oops-meeting/.
location = /oops-meeting/label { return 301 /oops-meeting/label/; }
location ^~ /oops-meeting/label/ {
    client_max_body_size 2m;
    client_body_timeout 15s;
    limit_req zone=oops_label_requests burst=80 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8798/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
