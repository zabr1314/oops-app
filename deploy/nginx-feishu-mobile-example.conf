# Add these exact-match locations to the appropriate existing HTTPS servers.
# The callback's code/state must not be retained in access/error logs.
# No service credentials or OAuth secrets belong in these locations.

# Public entry server:
location = /oops-meeting/v1/feishu/callback {
    access_log off;
    error_log /dev/null crit;
    proxy_pass https://103.110.81.78:8444;
    proxy_ssl_server_name on;
    proxy_ssl_name huanqiu-backend.internal;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/huanqiu-zhilian-website/backend.crt;
    proxy_http_version 1.1;
    proxy_set_header Host giftedprofessor.xyz;
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
}

