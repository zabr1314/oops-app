# Include alongside the existing /oops-meeting/ and /oops-meeting/label/ locations.
location = /oops-meeting/history { return 301 /oops-meeting/history/; }
location ^~ /oops-meeting/history/ {
    client_max_body_size 1k;
    client_body_timeout 10s;
    limit_req zone=oops_label_requests burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8797/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Referrer-Policy no-referrer always;
}
