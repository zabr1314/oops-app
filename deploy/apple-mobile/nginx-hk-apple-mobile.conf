# Include inside the existing Hong Kong :8444 server through locations.conf.
# Keep the URI prefix: the independent gateway strips it itself.
location ^~ /oops-meeting/apple-mobile/ {
    client_max_body_size 2m;
    client_body_timeout 30s;
    limit_req zone=oops_meeting_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn oops_meeting_connections 8;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:8799;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Request-ID $http_x_request_id;
    proxy_set_header X-Content-SHA256 $http_x_content_sha256;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_next_upstream off;
    access_log off;
    add_header Referrer-Policy no-referrer always;
}
